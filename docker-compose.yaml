services:
  # PHP Service
  app:
    user: "www-data"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mykpg
    image: tetra/mykpg
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - mykpg_storage:/var/www/storage/app
    networks:
      - mykpg_network

  # Queue Worker Service
  queue:
    user: "www-data"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mykpg_queue
    image: tetra/mykpg
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --verbose --tries=3 --timeout=300
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - mykpg_storage:/var/www/storage/app
    depends_on:
      db:
        condition: service_healthy  # Tunggu sampai db healthy
      app:  # Juga tunggu app siap
        condition: service_started
    networks:
      - mykpg_network

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: mykpg_nginx
    restart: unless-stopped
    ports:
      - "8011:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - mykpg_storage:/var/www/storage/app
    networks:
      - mykpg_network

  # MySQL Service
  db:
    image: mysql
    container_name: mykpg_db
    restart: unless-stopped
    ports:
      # Default supaya `docker compose up mailpit` (atau perintah lain) tetap valid walau DB_EXPOSE_PORT kosong di .env
      - "${DB_EXPOSE_PORT:-127.0.0.1:3306:3306}"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mykpg_db_storage:/var/lib/mysql
    networks:
      - mykpg_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Mailpit: tangkap email lokal (SMTP 1025, UI http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: mykpg_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - mykpg_network

  # Scheduler Service
  scheduler:
    user: "www-data"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mykpg_scheduler
    image: tetra/mykpg
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - mykpg_storage:/var/www/storage/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mykpg_network

networks:
  mykpg_network:
    driver: bridge

volumes:
  mykpg_storage: {}
  mykpg_db_storage: {}
