services:
  # PHP Service
  app:
    user: "www-data"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mykpg_prod
    image: tetra/mykpg:prod
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - mykpg_prod_storage:/var/www/storage/app
    networks:
      - mykpg_prod_network

  # Queue Worker Service
  queue:
    user: "www-data"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mykpg_prod_queue
    image: tetra/mykpg:prod
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --verbose --tries=3 --timeout=300
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - mykpg_prod_storage:/var/www/storage/app
    depends_on:
      db:
        condition: service_healthy  # Tunggu sampai db healthy
      app:  # Juga tunggu app siap
        condition: service_started
    networks:
      - mykpg_prod_network

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: mykpg_prod_nginx
    restart: unless-stopped
    ports:
      - "8031:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - mykpg_prod_storage:/var/www/storage/app
    networks:
      - mykpg_prod_network

  # MySQL Service
  db:
    image: mysql
    container_name: mykpg_prod_db
    restart: unless-stopped
    ports:
      - "${DB_EXPOSE_PORT}"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mykpg_prod_db_storage:/var/lib/mysql
    networks:
      - mykpg_prod_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  mykpg_prod_network:
    driver: bridge

volumes:
  mykpg_prod_storage: {}
  mykpg_prod_db_storage: {}
