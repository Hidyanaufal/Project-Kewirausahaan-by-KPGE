services:
  nginx:
    container_name: mykpg_nginx_prod
    ports:
      - "8031:80"
  db:
    container_name: mykpg_db_prod
  app:
    container_name: mykpg_app_prod
  queue:
    container_name: mykpg_queue_prod
networks:
  app_network:
    name: mykpg_network_prod
volumes:
  app_storage:
    name: mykpg_prod_storage
  db_storage:
    name: mykpg_prod_db
